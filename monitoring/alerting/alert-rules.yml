# Prometheus alerting rules
# Referenced from prometheus.yaml via:
#   rule_files:
#     - /etc/prometheus/alert-rules.yml

groups:
  - name: infrastructure
    rules:

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is unreachable"
          description: >
            Node Exporter on {{ $labels.instance }} has been unreachable
            for more than 1 minute. The EC2 instance may be stopped or
            the Node Exporter process may have crashed.

      - alert: HighCPU
        expr: |
          100 - (
            avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100
          ) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: >
            CPU utilisation on {{ $labels.instance }} has been above 85%
            for more than 5 minutes. Current value: {{ $value | printf "%.1f" }}%.

      - alert: HighMemory
        expr: |
          (
            node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
          ) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: >
            Memory usage on {{ $labels.instance }} has been above 90%
            for more than 5 minutes. Current value: {{ $value | printf "%.1f" }}%.

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!="tmpfs"} /
           node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: >
            Disk {{ $labels.mountpoint }} on {{ $labels.instance }} has less
            than 15% free space. Current: {{ $value | printf "%.1f" }}% free.

  - name: application
    rules:

      - alert: HighErrorRate
        expr: |
          (
            sum by (instance) (
              rate(http_requests_total{status=~"5.."}[2m])
            ) /
            sum by (instance) (
              rate(http_requests_total[2m])
            )
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate on {{ $labels.instance }}"
          description: >
            HTTP 5xx error rate on {{ $labels.instance }} has been above 5%
            for more than 2 minutes. Current rate: {{ $value | printf "%.2f" }}%.

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, instance) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.instance }}"
          description: >
            p95 response time on {{ $labels.instance }} has been above 500ms
            for more than 5 minutes. Current p95: {{ $value | printf "%.3f" }}s.

      - alert: APIDown
        expr: |
          sum(up{job="fastapi"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI backend is unreachable"
          description: >
            Prometheus cannot scrape the FastAPI /metrics endpoint.
            The backend application may be down.